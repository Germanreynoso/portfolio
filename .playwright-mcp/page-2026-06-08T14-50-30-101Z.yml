        - paragraph [ref=e102]: "\"Mateo de 6 años se soltó de mi mano en una plaza llena. Fueron 5 minutos de terror, hasta que un policía lo encontró. Escaneó su pulsera y me llamó al instante. Mateo no tuvo que decir nada, su pulsera habló por él.\""
