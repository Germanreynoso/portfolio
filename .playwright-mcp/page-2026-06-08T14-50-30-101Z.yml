          - heading "Carla M." [level=5] [ref=e105]
          - text: Madre de Mateo
      - generic [ref=e106]:
        - generic [ref=e107]: 
        - paragraph [ref=e108]: "\"Salí a rodar solo y tuve una caída fuerte. Perdí el conocimiento por unos minutos. Los médicos supieron que soy alérgico a ciertos medicamentos gracias al SOS QR antes de llegar al hospital. Eso evitó complicaciones graves.\""
        - generic [ref=e110]:
          - heading "Rodrigo G." [level=5] [ref=e111]
          - text: Ciclista Amateur
      - generic [ref=e112]:
        - generic [ref=e113]: 
        - paragraph [ref=e114]: "\"Mi abuelo se desorientó en una feria de artesanos durante el viaje. Una vendedora vio su SOS QR, escaneó el código y nos envió un mensaje de WhatsApp con su ubicación. Lo encontramos en menos de 10 minutos gracias a la tecnología.\""
