        - heading "¿Cómo surgió esta idea?" [level=3] [ref=e64]
        - paragraph [ref=e65]: Hace poco tiempo, en nuestra provincia, ocurrió una tragedia evitable. Una persona con discapacidad mental se desorientó y se perdió. Quienes lo encontraron no tenían forma de saber quién era ni cómo contactar a su familia. Lamentablemente, falleció solo.
        - blockquote [ref=e66]: "\"Nadie debería morir solo por no poder decir su nombre.\""
        - paragraph [ref=e67]:
          - text: De esa necesidad dolorosa nace
          - strong [ref=e68]: SOS QR
          - text: ": hoy evolucionado para proteger a"
          - strong [ref=e69]: cualquier persona
          - text: ", desde niños en excursiones hasta deportistas de riesgo, garantizando que quien te encuentre sepa quién eres en segundos."
